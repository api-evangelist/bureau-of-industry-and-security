  style: api-key
  parameter: subscription-key
  location: [header, query]
  obtained_at: https://developer.trade.gov/signup
  approval_required: false
  challenge: >-
    HTTP 401 with WWW-Authenticate: AzureApiManagementKey realm="...",
    name="subscription-key", type="header"
  cross_reference: authentication/bureau-of-industry-and-security-authentication.yml
idempotency:
  coverage: none
  applicability: na
  scope: []
  header: null
  note: >-
    NOT APPLICABLE, not missing. The published surface is read-only: two GET operations
    (searchCSL, listCSLSources) and three static bulk downloads. There is no mutating
    request for a replay-protection mechanism to protect, so `na` is the honest verdict and
    this record deliberately carries NO Idempotency pointer in apis.yml.
reversibility:
  applicability: na
  grade: na
  note: >-
    No write surface exists, so there is nothing to reverse. Recording `na` rather than a
    zero: an agent calling this API cannot take an action that needs taking back.
  write_surfaces: []
dry_run_mode:
  applicability: na
  note: Read-only surface; a rehearsal mode would be meaningless.
pagination:
  style: offset-limit
  params:
    offset:
      name: offset
      max: 1000
      quote: "The offset parameter defines the offset from the first result you want to fetch. This value cannot be greater than 1000."
    size:
      name: size
      max: 50
      quote: "The size parameter allows you to configure the number of results to be returned up to a maximum of 50."
  response_fields:
    total: total
    results: results
  ceiling_note: >-
    offset max 1000 and size max 50 together cap paginated retrieval at roughly the first
    1,050 matches. An agent that needs the whole list must use the bulk download, not
    pagination — this is a real and undocumented consequence of the two published ceilings.
  cursor: false
