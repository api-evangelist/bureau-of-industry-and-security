onboarding:
  sign_up: https://developer.trade.gov/signup
  sign_in: https://developer.trade.gov/signin
  approval_required: false
  cost: free
  subscriptions_limit: 1
  steps:
    - Register an account on the ITA Data Services Platform.
    - Subscribe to the "Data Services Platform APIs" product.
    - Send the issued key as the `subscription-key` header on every request.
  note: >-
    Self-serve with no approval gate — verified from the product catalogue
    (approvalRequired: false), not from marketing copy.
unauthenticated_surface:
  exists: true
  note: >-
    The full dataset is readable with no credential at
    https://data.trade.gov/downloadable_consolidated_screening_list/v1/consolidated.{json,csv,tsv}
    (HTTP 206 on a ranged request, 2026-09-05). Only the query API requires a key.
scopes:
  supported: false
  note: >-
    A subscription key carries no scopes, no audience and no expiry. There is nothing to
    delegate and nothing to narrow, so scopes/ is deliberately absent from this repository
    rather than written empty.
rotation:
  documented: false
  note: >-
    Azure API Management issues a primary and secondary key per subscription, which makes
    zero-downtime rotation possible, but ITA documents no rotation guidance.
