    parameter: subscription-key
    description: >-
      The same subscription key sent as a query-string parameter. Declared by ITA's own
      OpenAPI export as `apiKeyQuery`. A key in a URL is logged by proxies, browsers and
      server access logs — prefer the header.
    sources:
      - openapi/_original/bureau-of-industry-and-security-csl-apim-export.yaml
