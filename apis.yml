  reason: null
  detail: >-
    Contract discovery beat the JS-rendered docs host: the real first-party OpenAPI for the
    Consolidated Screening List is exportable anonymously from the International Trade
    Administration's Azure API Management portal, and BIS serves its own DCAT-US 3.0 catalog
    at https://www.bis.gov/data.json.
  evidence:
    - url: https://developer.trade.gov/developer/apis/consolidated-screening-list?api-version=2022-04-01-preview&export=true&format=openapi
      status: 200
    - url: https://www.bis.gov/data.json
      status: 200
    - url: https://data.trade.gov/downloadable_consolidated_screening_list/v1/consolidated.json
      status: 206
  checked: '2026-09-05'
x-operator-note:
  operated_by: International Trade Administration (ITA), U.S. Department of Commerce
  contributing_agency: Bureau of Industry and Security (BIS), U.S. Department of Commerce
  callable_host: data.trade.gov
  basis: >-
    The one callable API in this profile, the Consolidated Screening List API, is OPERATED by
    the International Trade Administration on data.trade.gov. The Bureau of Industry and
    Security is a contributing agency: BIS owns four of the thirteen consolidated source
    lists (DPL, EL, MEU, UVL), the API's own `sources` enum names them under "Department of
    Commerce - Bureau of Industry and Security (BIS)", and BIS lists this dataset - and only
    this dataset - in its own DCAT-US 3.0 catalog at https://www.bis.gov/data.json. That is
    the basis on which the contract is profiled here; the callable host belongs to ITA.
  bis_operated_systems: >-
    SNAP-R (https://snapr.bis.doc.gov/) and STELA are BIS-operated, but both are human-facing
    web applications with no published machine interface.
